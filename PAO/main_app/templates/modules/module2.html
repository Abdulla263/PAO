{% extends 'base.html' %}

{% block content %}
<div>
  <h2>Module {{ module.id }}</h2>
  <h1>{{ module.title }}</h1>
  <p>{{ module.description }}</p>
</div>
<a href="{% url 'quiz' module.id %}">
  <button style="background-color: lightblue; padding: 10px; border-radius: 20px">Test Your Knowledge</button>
</a>
{% endblock %}
