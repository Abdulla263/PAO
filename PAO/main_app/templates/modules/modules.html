{% extends 'base.html' %}

{% block content %}
<h1>Modules</h1>
{% for module in modules %}
  <div class="module-card">
    <a href="{% url 'detail' module.id %}">
    <h2>Module {{ module.id }}: <b>{{ module.title }}</b></h2></a>
    <p>{{ module.description }}</p>
  </div>
  <br>
{% endfor %}

{% endblock %}
