{% extends 'base.html' %}
{% load static %}

{% block content %}
<h2>Edit Profile</h2>

<form method="POST" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_table }}

  {% if form.instance.image %}
      <p>Current image:</p>
      <img src="{{ form.instance.image.url }}" width="150" alt="Profile Image">
  {% endif %}

  <button type="submit">Save Changes</button>
</form>
{% endblock %}
