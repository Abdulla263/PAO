{% extends "base.html" %}

{% block content %}
<h1>Delete Question</h1>
{% if user.is_staff %}
<p>Are you sure you want to delete this question?</p>
<p><b>{{ object.text }}</b></p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Delete</button>
    <a href="{% url 'quiz' module_id=object.module.id %}">Cancel</a>
</form>
{% else %}
<p>Only staff can access this page.</p>
{% endif %}
{% endblock %}
